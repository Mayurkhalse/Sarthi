[project]
name = "sarthi"
version = "0.1.0"
description = "Sarthi — IDE-Independent Engineering Intelligence & Verification Platform"
readme = "README.md"
authors = [
    { name = "Mayurkhalse", email = "163679044+Mayurkhalse@users.noreply.github.com" }
]
requires-python = ">=3.11, <3.14"
dependencies = [
    "jinja2>=3.1.6",
    "mcp>=2.3.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
sarthi = "sarthi.cli:app"
forgecore = "sarthi.cli:app"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["standards/verifiers/semgrep/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_default_fixture_loop_scope = "function"
timeout = 60
timeout_method = "thread"
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
markers = [
    "security_ci_only: OS-level kernel isolation penetration tests for Linux/CI runners",
]
addopts = "-m 'not security_ci_only'"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.3",
]
