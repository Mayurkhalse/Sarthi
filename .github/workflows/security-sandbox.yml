name: Security Sandbox Penetration (Linux)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  kernel-penetration:
    name: Linux Bubblewrap & cgroup v2 Penetration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Install Bubblewrap Isolation Primitives & System Python
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3

      - name: Configure Linux Kernel User Namespaces & cgroup v2 Delegation
        run: |
          echo "=== Enable Unprivileged User Namespaces (Ubuntu 24.04 AppArmor) ==="
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

          echo "=== Configure cgroup v2 Delegation for Runner ==="
          # Evacuate any processes from root cgroup into an init slice to comply with 'no internal processes' rule
          if [ -s /sys/fs/cgroup/cgroup.procs ]; then
            echo "Moving root cgroup processes to /sys/fs/cgroup/init..."
            sudo mkdir -p /sys/fs/cgroup/init
            sudo bash -c "xargs -rn1 < /sys/fs/cgroup/cgroup.procs > /sys/fs/cgroup/init/cgroup.procs 2>/dev/null || true"
          fi

          # Enable controllers in root cgroup
          sudo bash -c "echo '+pids +memory' > /sys/fs/cgroup/cgroup.subtree_control" || true

          # Create dedicated /sys/fs/cgroup/sarthi delegation directory (zero internal processes, avoiding EBUSY)
          sudo mkdir -p /sys/fs/cgroup/sarthi
          sudo chown -R runner:runner /sys/fs/cgroup/sarthi
          sudo chmod -R a+rwX /sys/fs/cgroup/sarthi
          sudo bash -c "echo '+pids +memory' > /sys/fs/cgroup/sarthi/cgroup.subtree_control" || true

          # Grant common ancestor migration write permissions on cgroup.procs
          sudo chmod a+w /sys/fs/cgroup/cgroup.procs || true
          sudo chown runner:runner /sys/fs/cgroup || true

      - name: Audit Host Kernel & cgroup v2 Topology
        run: |
          echo "=== Kernel Version ==="
          uname -a
          echo "=== Bubblewrap Version ==="
          bwrap --version
          echo "=== User Namespace Test ==="
          bwrap --ro-bind /usr /usr --proc /proc --dev /dev --unshare-user -- true && echo "bwrap userns OK" || echo "bwrap userns FAILED"
          echo "=== Sandbox Python Test ==="
          bwrap --ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 --proc /proc --dev /dev --unshare-user -- /usr/bin/python3 -c "import sys; print('Sandbox Python OK:', sys.version)" || echo "bwrap python FAILED"
          echo "=== cgroup v2 Root Controllers ==="
          cat /sys/fs/cgroup/cgroup.controllers || true
          echo "=== cgroup v2 Root Subtree Control ==="
          cat /sys/fs/cgroup/cgroup.subtree_control || true
          echo "=== cgroup v2 Sarthi Controllers ==="
          cat /sys/fs/cgroup/sarthi/cgroup.controllers || true
          echo "=== cgroup v2 Sarthi Subtree Control ==="
          cat /sys/fs/cgroup/sarthi/cgroup.subtree_control || true
          echo "=== Process cgroup ==="
          cat /proc/self/cgroup

      - name: Run Adversarial Security Penetration Tests
        env:
          SARTHI_SANDBOX_CERTIFIED: "1"
        run: |
          uv run pytest -m security_ci_only tests/e2e/test_sandbox_kernel_penetration.py -v --durations=0
