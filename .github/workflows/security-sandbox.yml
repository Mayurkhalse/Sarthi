name: Security Sandbox Penetration (Linux)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  kernel-penetration:
    name: Linux Bubblewrap & cgroup v2 Penetration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Install Bubblewrap Isolation Primitives & System Python
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3

      - name: Configure Linux Kernel User Namespaces & cgroup v2 Delegation
        run: |
          echo "=== Enable Unprivileged User Namespaces (Ubuntu 24.04 AppArmor) ==="
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

          echo "=== Configure cgroup v2 Delegation for Runner ==="
          # Enable controllers in root cgroup
          sudo bash -c "echo '+pids +memory' > /sys/fs/cgroup/cgroup.subtree_control" || true

          # Identify runner's cgroup slice from /proc/self/cgroup
          CGROUP_REL=$(grep '^0::' /proc/self/cgroup | cut -d: -f3 | sed 's|^/||')
          echo "Runner cgroup relative path: $CGROUP_REL"

          if [ -n "$CGROUP_REL" ] && [ -d "/sys/fs/cgroup/$CGROUP_REL" ]; then
            RUNNER_CGROUP="/sys/fs/cgroup/$CGROUP_REL"
            echo "Delegating runner cgroup: $RUNNER_CGROUP"
            sudo chown -R runner:runner "$RUNNER_CGROUP" || true
            sudo bash -c "echo '+pids +memory' > $RUNNER_CGROUP/cgroup.subtree_control" || true
          fi

          # Ensure /sys/fs/cgroup root is delegated if runner executes at root level
          sudo chown runner:runner /sys/fs/cgroup || true

      - name: Audit Host Kernel & cgroup v2 Topology
        run: |
          echo "=== Kernel Version ==="
          uname -a
          echo "=== Bubblewrap Version ==="
          bwrap --version
          echo "=== User Namespace Test ==="
          bwrap --ro-bind /usr /usr --proc /proc --dev /dev --unshare-user -- true && echo "bwrap userns OK" || echo "bwrap userns FAILED"
          echo "=== Sandbox Python Test ==="
          bwrap --ro-bind /usr /usr --proc /proc --dev /dev --unshare-user -- /usr/bin/python3 -c "import sys; print('Sandbox Python OK:', sys.version)" || echo "bwrap python FAILED"
          echo "=== cgroup v2 Controllers ==="
          cat /sys/fs/cgroup/cgroup.controllers || true
          echo "=== Process cgroup ==="
          cat /proc/self/cgroup

      - name: Run Adversarial Security Penetration Tests
        env:
          SARTHI_SANDBOX_CERTIFIED: "1"
        run: |
          uv run pytest -m security_ci_only tests/e2e/test_sandbox_kernel_penetration.py -v --durations=0
